.important[
When the number of operations is directly proportional to the input size `N`
(here, page turns vs. pages), the algorithm is __linear__, or `O(N)`.
]

## Searching For Jane Wong (Take 2)

Skipping two pages at a time is faster than Take 1, but we can miss Jane
unless we go back when we overshoot (phone books are sorted).

--

.pseudocode[
1. open the phone-book on page one
1. if Jane Wong is on that page
    - get her number
1. otherwise
    - if the current page contains names _after_ Jane Wong
        - __go back one page__
        - go back to step two
    - otherwise
        - __flip two pages__
        - go back to step 2
]

--

This is still a __linear algorithm__: we eliminate 1 or 2 pages at a time,
so the number of page turns is still proportional to the number of pages
(`O(N)`). It is about twice as fast as Take 1, but we can do better.

## Searching For Jane Wong (Take 3)

This is the algorithm that most people would follow (well, approximately).

.pseudocode[
1. if there is no phone-book left
    - Jane Wong is not listed, can't get her number
1. open the phone-book to the middle page
1. if Jane Wong is on that page
    - get her number
1. otherwise, if the page contains names _after_ Jane Wong
    - tear the phone book in half
    - throw out the second half (including the page you just looked at)
    - go back to step 1
1. otherwise, if the page contains names _before_ Jane Wong
    - tear the phone book in half
    - throw out the first half (including the page you just looked at)
    - go back to step 1
]

--

- Is the algorithm correct? (i.e., will it find Jane Wong in the phone book?)
--
 __YES__

--

- Is it efficient? (i.e., is this the fastest way of doing it?)
--
 __YES__ (although we won't prove it)

--

- Assuming that there are 1,000 pages in the phone book, how many page turns will it require?
--
 <br>__at most 10__

--

- How about if there are 10,000 pages in the phone book? How many page turns will be needed?
--
<br>__at most 14__

---

## Power of Halving

.left-column2[
The significant performance improvement in this algorithm comes from halving the number of pages
that we need to look at after we examine each page.
- in _take 1_ and _take 2_ the number of pages that we eliminated was 1 or 2
- in _take 3_ the number of pages that we eliminate is equal to the half of the remaining pages

.important[
When the search space is halved after each comparison, the algorithm is __logarithmic__, or `O(log N)`:
running time grows proportionately to the logarithm of the input size `N`.
]
]

<img alt="cutting number of pages in half after each test" src="img/03/binary.gif" width=380px />

# Working with Arrays



---
name: array-contiguous
## Constant Access Time to Elements

Recall the array image from last class (with memory addresses indicated below):
.center80[.center[
<img alt="integer array with marked memory addresses" src="img/02/arrays-23.jpg" width=400px />
]]

Because an array occupies contiguous memory locations, __the access to individual elements
is instantaneous.__

--

For example, when we execute
```
    System.out.println(array[3]);
```
we get the element at index `3` right away.

--

It does not matter how big the array is. It also
does not matter if we are trying to access an element at index `3` or at index `3000`, the access time
is going to be the same.

---
template: array-contiguous

.important[
When an operation is independent of the number of elements in the data structure,
it is said to be __constant__, which is denoted as `O(1)`.
]

---

## Searching in an Array

For searching in an array, we can apply similar algorithms as for searching in a phone book:

- If the data in our array is __not sorted__, then we will use a __linear search__, `O(N)`.

- If the data in our array is __sorted__, then we can use a __binary search__, `O(log N)`.

## Adding an Element to an Array

- The initial add operations were fast. In fact, they were performed in __constant time__.

--

- But once the array is _full_ we need to do a lot of work in order to add another element:
  .pseudocode[
1. create a new, larger array
1. for each element in the original array
  - copy it to the new array
1. add the new element to the new array
  ]

--

  This is a __linear time__ algorithm, and it may take a lot of time if the
original array had many elements.

--

<div style="margin:3em 0 0 0">
.center[.large[Can we do better? ]]

## Linked List

The _construct_ that we created on a previous slide is a linked list.

.center[
<img alt="add elements to an array" src="img/03/linked_list-48.jpg" width=450px />
]

## Linked List

A __linked list__ is a linear collection of data elements in which each element
points to the next one.

--

name: linked-list
.left-column2-large[
The list is usually composed of __nodes__ that contain the actual data part and
the memory address of the next element.
]

```Java
class Node {
  int data;
  Node next;
}
```
--


.center[
<img alt="add elements to an array" src="img/03/linked_list-49.jpg" width=750px />

This list has six nodes.

]

---
template: linked-list

.center[
<img alt="add elements to an array" src="img/03/linked_list-50.jpg" width=750px />
]

In order to work with a linked list, we need to keep track of where it starts, and,
sometimes where it ends:
- __`head`__ is a reference to the first node (or to the _head of the list_)
- __`tail`__ is a reference to the last node (or the _tail of the list_)



.important[Note that `head` and `tail` are references to nodes, they are __not__ nodes themselves.]

---
template: linked-list

.center[
<img alt="add elements to an array" src="img/03/linked_list-50.jpg" width=750px />
]

References that do not point to anything are set to `0x0` (or zero) which is often
described as __`null`__.

--

.aside[
You probably have seen references to `null` value when your program crashed with a `NullPointerException`.
This simply means that the program tried to access some data that does not really exist.
It tried to access something through a reference whose value was `null`.
]


---
template: linked-list

.center[
<img alt="add elements to an array" src="img/03/linked_list-51.jpg" width=750px />
]

As mentioned before, we will not worry about the actual memory addresses. These
are stored by references in our programs and we do not need to know their actual values
to understand how the data structure works.

---
## Adding to a Linked List

So how do we add to a linked list?

- We saw that this should not require duplicating any elements since the list is never really full.

- But how many steps will it take?

--

.pseudocode[
1. Create a new node
  - set its value as desired
  - set its reference to the `next` node to `null`
1. if `tail` points to a node
  - set `tail.next` to the newly created node
  - advance tail to the newly created node

  otherwise (list is empty)
  - set `tail` and `head` to the newly created node
]

--

.important[
Adding to the end of a linked list does not depend on the number of elements
that are already in that list (i.e., it is independent of the length
of that list). This is a __constant time__ algorithm, or `O(1)` algorithm.
]

---

## Accessing Individual Elements

How can we access individual elements in a linked list?

Can we just get to an element at position 4 or 40 immediately (as we can with an array)?

--

Not really, because we do not have a reference to that element. We need to find out
where in memory it is stored. Let's say we want the fourth element ( this would be index 3 in the array):

--
- the memory address of that element is stored in the third node,

--
- the memory address of the third node is stored in the second node,

--
- the memory address of the second node is stored in the first node,

--
- and the memory address of the first node is stored in the `head` reference

--

__So, we need to start at the `head` reference and follow the information trail.__

.pseudocode[
Get the value of the fourth node

1. create a temporary reference called current and point it to the first node
1. initialize a counter to one
1. while counter is less than 4
  - set current to current.next
  - increment counter by one
1. return current.data
]


_Note that this assumes that we have at least four nodes in our list._


---
## Searching in a Linked List


The last thing we'll discuss about linked list for now is searching.

For an array, we used:
- linear search, when data was not sorted
- binary search, when data was sorted

What can we do for a linked list?

## What Is a Stack?

<figure style="float:right">
<img width="325" alt="a stack" src="https://upload.wikimedia.org/wikipedia/commons/2/29/Data_stack.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original">  </img>
<figcaption markdown="1">.small[Boivie / [WikimediaCommons](https://commons.wikimedia.org/wiki/File:Data_stack.svg)
  / Public Domain ]<figcaption markdown="1">
</figure>

.left-column2[
.important[
__Stack__ is a linear structure in which the elements can be added
to and removed from only one end. <br>
It is often referred to as a __last in first out__ (LIFO) data structure, because the
element that was added most recently will be removed before the elements that
have been added before it.
]
]

--

.below-column2[

.important[
Stack operations are:
- __`push`__ which adds an element to the top of the stack
- __`pop`__ which removes (and often returns) the element from the top of the stack
- __`top`__ which returns (but does not remove) the element from the top of the stack
]
]


We will look at ways of implementing stacks using both arrays and linked lists.
Our performance goal for all of the operations will be __O(1)__!

## What Is a Queue

.left-column2[
.important[
__Queue__ is a linear structure in which the elements can be added at the back
(one end of the queue) and removed from the front (the other end of the queue). <br>
It is often referred to as a __first in first out__ (FIFO) data structure, because the
element that was added most recently will be removed after the elements that
have been added before it.
]
]

.right-column2[
<figure >
<img width="300" alt="a queue" src="https://upload.wikimedia.org/wikipedia/commons/5/52/Data_Queue.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original">  </img>

  /  [CC BY-SA](https://creativecommons.org/licenses/by-sa/3.0) ]<figcaption markdown="1">
</figure>

]

--

.below-column2[

.important[
Queue operations are:
- __`enqueue`__ which adds an element to the end/back of the queue
- __`dequeue`__ which removes (and often returns) the element from the front of the queue
- __`font`__ which returns (but does not remove) the element at the front of the queue
]
]


We will look at ways of implementing queues using both arrays and linked lists.
Our performance goal for all of the operations will be __O(1)__!

## Array vs Linked List Performance

At the end of the _Arrays vs Linked List_ discussion, some of you might have been a
bit unsatisfied with the benefits of the linked list design:

.continue-column[
.left-column2[
Arrays
- .green[constant access time to elements, `O(1)`]
]
.right-column2[
Linked List
- .red[linear access time to elements, `O(N)`]
]
]
.continue-column[
.left-column2[
- linear time search, if unsorted, `O(N)`
]
.right-column2[
- linear time search, if unsorted, `O(N)`
]
]
.continue-column[
.left-column2[
- .green[logarithmic time search, if sorted, `O(log N)`]
]
.right-column2[
- .red[linear time search, if sorted, `O(N)`]
]
]
.continue-column[
.left-column2[
- .red[possibly linear time to add an element (when the array is full and we need to resize), `O(N)`]
]
.right-column2[
- .green[constant time to add an element to the end (because there is no need to resize), `O(1)`]
]
]

--

.below-column2[
<br/>

----

__BUT__ the linked lists give us:
- the idea of connecting elements in a different way, and we'll use it in more complicated structures
- building blocks for more complicated structures
- very good performance when we operate only on the ends (i.e., no need to access any elements except for
first and last)
- good enough performance when we do not need binary search
- good enough performance when we are working with small lists
]

## Getting Back Binary Search

Can we design a data structure that does not use contiguous memory locations (like an array) but still allows us to use something like the binary search algorithm?

<img alt="from a binary search to a bst" src="img/03/bst-67.jpg" width=400px />

## Binary Search Trees

.left-column2-larger[
.important[
A __binary search tree__ is a structure that starts with a special element called
__root__ and in which all the values stored to the left of the root are smaller than it,
and all the values stored to the right of the root are larger than it.
]
.center[
<img alt="bst structure" src="img/03/bst-83.jpg" width=350px />
]
We will look at ways of implementing binary search trees so that they
guarantee O(log N) performance on pretty much all operations (although this will
require some balancing work!).

]

## Summary of Important Concepts

Algorithmic running time
- constant, `O(1)`, running time does not depend on the size of the data structure
- logarithmic, `O(log N)`, running time grows proportionately to the `log`
of number of elements in the data structure (usually achieved by halving)
- linear, `O(N)`, running time grows proportionately to the number of
elements in the data structure (usually because we need to look at all elements)

--

Arrays
- constant access time to elements, `O(1)`
- linear time search, if unsorted, `O(N)`
- logarithmic time search, if sorted, `O(log N)`
- possibly linear time to add an element (when the array is full and we need to resize), `O(N)`

--

Linked List
- linear access time to elements, `O(N)`
- linear time search, if unsorted, `O(N)`
- linear time search, if sorted, `O(N)`
- constant time to add an element to the end (because there is no need to resize), `O(1)`


---


## Summary of Important Concepts

Stack (last in, first out)
- operations allowed only at one end: `push`, `pop`, `top`
- goal: `O(1)` performance for `push` and `pop`


Queue (first in, first out)
- operations allowed only at the two ends: `enqueue`, `dequeue`, `front`
- goal: `O(1)` performance for `enqueue` and `dequeue`



Binary Search Tree
- gaining back the binary search for _sorted_ data
- goal: `O(logN)` performance for almost all operations

# Examples and Things to Think About

## Array Resizing Costs

Suppose you have a dynamic array (one that will _grow_ as we need more space) that starts with a capacity of **4** elements and **doubles** its capacity every time it becomes full. 

You perform a sequence of **9 add operations** into an initially empty array.

- How many total element copy operations occur across all resizes?

- At which specific insertion steps (1st, 2nd, 3rd... 9th) do resizes take place?

- What is the final capacity of the array after all 9 elements are added?

---

## Linked Lists and Binary Search

We saw that sorting an **array** allows us to use binary search to find elements in **`O(log N)`** time.

Suppose we have a **sorted linked list** containing 1,000 elements.

- Can we perform a binary search directly on this sorted linked list to achieve `O(log N)` search time? 

- What step of the binary search algorithm becomes expensive in a linked list, and why?

## Big-O Complexity Matching

Classify each of the following scenarios into its tightest Big-O time complexity (**`O(1)`**, **`O(log N)`**, or **`O(N)`**):

1. Accessing the element at index `450` in an array of size `1,000`.

2. Finding an element in a sorted array of `1,000,000` items using binary search.

3. Accessing the i'th node  in a linked list.

4. Pushing an element onto the top of a stack.

5. Searching for an item in an unsorted array of `N` items.

6. Adding a new node to the end of a linked list when a `tail` reference is maintained.
